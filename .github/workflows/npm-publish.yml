name: Publish npm Packages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run validation and publish commands without uploading packages."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check types
        run: bun run check-types

      - name: Test
        run: bun test

      - name: Pack packages
        shell: bash
        run: |
          set -euo pipefail

          for manifest in packages/*/package.json; do
            package_dir="$(dirname "$manifest")"
            echo "::group::npm pack --dry-run ${package_dir}"
            (cd "$package_dir" && npm pack --dry-run --json)
            echo "::endgroup::"
          done

      - name: Publish packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          for manifest in packages/*/package.json; do
            package_dir="$(dirname "$manifest")"
            package_name="$(node -e "const p=require('./${manifest}'); console.log(p.name)")"
            package_version="$(node -e "const p=require('./${manifest}'); console.log(p.version)")"

            echo "::group::publish ${package_name}@${package_version}"

            if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
              echo "${package_name}@${package_version} already exists on npm; skipping."
              echo "::endgroup::"
              continue
            fi

            if [ "$DRY_RUN" = "true" ]; then
              (cd "$package_dir" && npm publish --access public --dry-run)
            else
              (cd "$package_dir" && npm publish --access public --provenance)
            fi

            echo "::endgroup::"
          done
